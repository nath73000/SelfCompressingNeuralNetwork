[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "selfcompress"
version = "0.1.0"
description = "Self-Compressing Neural Networks in PyTorch: each neuron learns its bit-width, neurons at 0 bits are pruned"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["torch>=2.0"]

[project.optional-dependencies]
examples = ["torchvision", "matplotlib"]
dev = ["pytest"]